name: Mise à jour automatique des données

on:
  schedule:
    # Exécution tous les lundis à 3h du matin (heure UTC)
    - cron: '0 3 * * 1'
  workflow_dispatch: # Permet aussi un déclenchement manuel

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    - name: Install dependencies
      run: npm install node-fetch
    
    - name: Run update script
      run: node scripts/update-data.js
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Commit and push if changed
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add data.json new-models.json version.json
        git diff --staged --quiet || git commit -m "🔄 Mise à jour automatique des données - $(date +%Y-%m-%d)"
        git push
